[project]
name = "ledgerline"
version = "0.1.0"
description = "Adaptive treasury controller for the Airwallex sandbox."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "pyyaml>=6",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.7",
]

[project.scripts]
ledgerline-demo = "ledgerline.demo:main"
ledgerline-verify = "ledgerline.receipt:main"
ledgerline-redteam = "ledgerline.redteam.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledgerline = ["templates/*.html", "static/*.css"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
