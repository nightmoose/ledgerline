name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest
      - name: Hostile suite (N of N refused by code)
        run: |
          python -m ledgerline.redteam.runner | tee redteam.md
          cat redteam.md >> "$GITHUB_STEP_SUMMARY"
      - name: Demo run and receipt check
        run: |
          LEDGERLINE_DATA_DIR=ci-data python -m ledgerline.demo
          python -m ledgerline.receipt verify ci-data/audit.jsonl
